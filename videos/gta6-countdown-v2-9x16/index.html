<!doctype html>
<html
  lang="de"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Hintergrund","default":"#12b5a6"},
    {"id":"color-sun","type":"color","label":"Sonne","default":"#ffd23f"},
    {"id":"color-ink","type":"color","label":"Text","default":"#0b2a33"},
    {"id":"color-paper","type":"color","label":"Papier","default":"#fff7e8"},
    {"id":"color-accent","type":"color","label":"Akzent","default":"#ff3d6e"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #12b5a6;
        --color-sun: #ffd23f;
        --color-ink: #0b2a33;
        --color-paper: #fff7e8;
        --color-accent: #ff3d6e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #sun {
        position: absolute;
        left: 240px;
        top: 1340px;
        width: 1100px;
        height: 1100px;
        border-radius: 50%;
        background: var(--color-sun);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground" data-layout-ignore><div id="sun"></div></div>
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="7.67"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="calendar"
        data-composition-id="calendar"
        data-composition-src="compositions/calendar.html"
        data-start="7.67"
        data-duration="12.37"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="story"
        data-composition-id="story"
        data-composition-src="compositions/story.html"
        data-start="20.04"
        data-duration="15.13"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="hype"
        data-composition-id="hype"
        data-composition-src="compositions/hype.html"
        data-start="35.17"
        data-duration="8.94"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <div
        id="facts"
        data-composition-id="facts"
        data-composition-src="compositions/facts.html"
        data-start="44.11"
        data-duration="8.15"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="52.26"
        data-duration="7.74"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 6"
      ></div>
      <audio
        id="voiceover"
        class="clip"
        src="assets/audio/voiceover.wav"
        data-start="0"
        data-duration="60"
        data-track-index="2"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
