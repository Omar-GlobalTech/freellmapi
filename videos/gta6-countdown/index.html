<!doctype html>
<html
  lang="de"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Hintergrund","default":"#FFB627"},
    {"id":"color-sun","type":"color","label":"Sonne","default":"#FF5B3A"},
    {"id":"color-ink","type":"color","label":"Text","default":"#1B1140"},
    {"id":"color-paper","type":"color","label":"Papier","default":"#FFF1D6"},
    {"id":"color-accent","type":"color","label":"Akzent","default":"#FF2E88"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #ffb627;
        --color-sun: #ff5b3a;
        --color-ink: #1b1140;
        --color-paper: #fff1d6;
        --color-accent: #ff2e88;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground" data-layout-ignore></div>
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="8.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="calendar"
        data-composition-id="calendar"
        data-composition-src="compositions/calendar.html"
        data-start="8.2"
        data-duration="12.55"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="story"
        data-composition-id="story"
        data-composition-src="compositions/story.html"
        data-start="20.75"
        data-duration="14.75"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="hype"
        data-composition-id="hype"
        data-composition-src="compositions/hype.html"
        data-start="35.5"
        data-duration="8.85"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>
      <div
        id="facts"
        data-composition-id="facts"
        data-composition-src="compositions/facts.html"
        data-start="44.35"
        data-duration="8.05"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 5"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="52.4"
        data-duration="7.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 6"
      ></div>
      <audio
        id="voiceover"
        class="clip"
        src="assets/audio/voiceover.wav"
        data-start="0"
        data-duration="60"
        data-track-index="2"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
